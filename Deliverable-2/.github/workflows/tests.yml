name: Deliverable-2 tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest -v test_protocol.py test_broker.py test_policy.py test_mininet_benchmark.py
        working-directory: Deliverable-2
